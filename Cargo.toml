[package]
name = "raid-race"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.19.0", default-features = false, features = [
	"3d_bevy_render",
	"default_app",
	"default_platform",
	"dynamic_linking",
	"scene",
	"audio",
] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
